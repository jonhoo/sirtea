[package]
name = "sirtea"
version = "0.1.0"
edition = "2021"
description = "Generate SRT subtitle files from video using local NVIDIA Parakeet speech-to-text"
repository = "https://github.com/jonhoo/sirtea"
license = "MIT OR Apache-2.0"
keywords = ["caption", "subtitle", "srt", "transcription", "speech-to-text"]
categories = ["command-line-utilities", "multimedia::video"]

[dependencies]
anyhow = "1.0.75"
directories = "6.0.0"
indicatif = "0.18.3"
lexopt = "0.3.1"
libc = "0.2.186"
# reqwest is only used to download the Parakeet model files on first run;
# transcription itself is fully local.
reqwest = "0.13"
serde = { version = "1.0.193", features = ["derive"] }
symphonia = { version = "0.5.3", default-features = false, features = ["mkv", "isomp4", "aac", "mp3", "flac", "ogg", "vorbis"] }
tokio = { version = "1.34.0", features = ["full"] }
toml = "0.9"
# transcribe-rs pins `ort = "=2.0.0-rc.12"` (exact), so bumping ort / ONNX
# Runtime has to go through a transcribe-rs release.
transcribe-rs = { version = "0.3.11", default-features = false, features = ["onnx"] }
walkdir = "2.5.0"

[features]
# GPU inference via ONNX Runtime's WebGPU execution provider, which works on
# AMD and NVIDIA alike from a single prebuilt ONNX Runtime binary (Dawn:
# Vulkan on Linux, D3D12 on Windows, Metal on macOS). The alternatives are
# worse: the ROCm execution provider was removed from ONNX Runtime ≥1.23,
# and CUDA would be a second, mutually-exclusive ~800MB binary variant that
# only helps NVIDIA.
#
# Default-on so source builds get the fast path; disabled for the prebuilt
# release binaries (see dist-workspace.toml): WebGPU drags in a separate
# libwebgpu_dawn.so that release installers cannot ship, and targets without
# pyke WebGPU prebuilts (e.g. aarch64-linux) fail to *link* with the feature
# on — build with --no-default-features there.
default = ["webgpu"]
webgpu = ["transcribe-rs/ort-webgpu"]

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
