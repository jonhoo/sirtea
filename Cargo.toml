[package]
name = "sirtea"
version = "0.1.0"
edition = "2021"
description = "Generate SRT subtitle files from video using the Gladia speech-to-text API"
repository = "https://github.com/jonhoo/sirtea"
license = "MIT OR Apache-2.0"
keywords = ["caption", "subtitle", "srt", "transcription", "speech-to-text"]
categories = ["command-line-utilities", "multimedia::video"]

[dependencies]
anyhow = "1.0.75"
directories = "6.0.0"
indicatif = "0.18.3"
lexopt = "0.3.1"
reqwest = { version = "0.11.22", features = ["json", "multipart", "stream"] }
serde = { version = "1.0.193", features = ["derive"] }
serde_json = "1.0.108"
symphonia = { version = "0.5.3", default-features = false, features = ["mkv", "flac"] }
tokio = { version = "1.34.0", features = ["full"] }
tokio-util = { version = "0.7.10", features = ["codec"] }
toml = "0.8.8"
