[package]
name = "sirtea"
version = "0.2.1"
edition = "2021"
description = "Generate SRT subtitle files from video using local NVIDIA Parakeet speech-to-text"
repository = "https://github.com/jonhoo/sirtea"
license = "MIT OR Apache-2.0"
keywords = ["caption", "subtitle", "srt", "transcription", "speech-to-text"]
categories = ["command-line-utilities", "multimedia::video"]

[dependencies]
anyhow = "1.0.75"
directories = "6.0.0"
indicatif = "0.18.3"
lexopt = "0.3.1"
symphonia = { version = "0.6.0", default-features = false, features = ["mkv", "isomp4", "aac", "mp3", "flac", "ogg", "vorbis"] }
# default-features = false drops toml's `serde` feature (and the unused
# `display` half); we read the two config keys through the serde-free
# `toml::de::DeTable` API, which keeps serde/serde_core out of the
# dependency tree entirely.
toml = { version = "1.1.3", default-features = false, features = ["parse", "std"] }
# Bindings to transcribe.cpp (ggml/GGUF speech-to-text). default-features =
# false drops the crate's default `metal` feature; the per-OS tables below
# add the right GPU backend back for each platform. transcribe-cpp-sys
# compiles the C++ core with cmake at build time, so cmake and a C++
# toolchain are build requirements.
transcribe-cpp = { version = "0.1.1", default-features = false }
# ureq is only used to download the Parakeet model files on first run;
# transcription itself is fully local. platform-verifier makes TLS use the
# OS trust store (like reqwest did) so TLS-intercepting proxies keep working.
ureq = { version = "3.3.0", features = ["platform-verifier"] }
walkdir = "2.5.0"

# ggml GPU backends are compile-time choices, and the natural one differs per
# OS: Vulkan on Linux (statically linked into the binary — no shared-library
# shipping problem — but needs the Vulkan SDK + glslc at build time), Metal
# on macOS. Machines without a usable GPU fall back to CPU at runtime, so
# there is no CPU-only build variant.
# TODO: Windows GPU (Vulkan should work there too; untested) — CPU-only for
# now.
[target.'cfg(target_os = "linux")'.dependencies]
transcribe-cpp = { version = "0.1.1", default-features = false, features = ["vulkan"] }

[target.'cfg(target_os = "macos")'.dependencies]
transcribe-cpp = { version = "0.1.1", default-features = false, features = ["metal"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
