# Sirtea configuration file
#
# Copy this file to one of:
#   Linux:   ~/.config/sirtea/config.toml
#   macOS:   ~/Library/Application Support/sirtea/config.toml
#   Windows: C:\Users\<user>\AppData\Roaming\sirtea\config.toml
#
# Or set the GLADIA_API_KEY environment variable instead.

# Required: Your Gladia API key
# Get one at https://app.gladia.io/ -> Account -> Generate Key
gladia_api_key = ""

# Optional: Maximum cost before stopping transcription (in dollars)
# Default: 10.0
# max_cost = 10.0

# Optional: Number of concurrent transcriptions
# Default: 3
# parallel = 3

# Optional: Maximum segment length in seconds before splitting
# Default: 5400 (1h30m)
# segment_length = 5400
