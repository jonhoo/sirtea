# Sirtea configuration file
#
# Copy this file to one of:
#   Linux:   ~/.config/sirtea/config.toml
#   macOS:   ~/Library/Application Support/sirtea/config.toml
#   Windows: C:\Users\<user>\AppData\Roaming\sirtea\config.toml

# Optional: Directory holding the Parakeet model files
# (encoder-model.int8.onnx, decoder_joint-model.int8.onnx, nemo128.onnx,
# vocab.txt from https://huggingface.co/istupakov/parakeet-tdt-0.6b-v3-onnx).
# Default: unset, meaning the model is downloaded automatically on first run
# into the per-user data dir (e.g. ~/.local/share/sirtea/models/ on Linux).
# model_path = "/path/to/parakeet-model"

# Optional: Maximum segment length in seconds before splitting
# The bundled Parakeet model accepts at most ~200 seconds of audio per
# inference call, so this cannot be raised meaningfully; lowering it mainly
# reduces memory use.
# Default: 195 (3m15s)
# segment_length = 195
