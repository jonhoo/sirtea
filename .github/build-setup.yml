# Extra steps injected into dist's build-local-artifacts job via the
# `github-build-setup` setting in dist-workspace.toml.
#
# Windows: match the C++ core's CRT to the Rust link. dist builds MSVC
# targets with RUSTFLAGS=-Ctarget-feature=+crt-static (its default
# `msvc-crt-static = true`), so rustc links the *static* CRT — the right
# posture for a self-contained CLI (no vcruntime140.dll / VC++ redist
# dependency on end-user machines). But transcribe-cpp-sys's CMake build
# ends up compiling /MD (dynamic CRT): cmake-rs only communicates the CRT
# choice through legacy /MT compiler flags, and transcribe.cpp requires
# CMake >= 3.16, where policy CMP0091 (NEW) selects the runtime from
# CMAKE_MSVC_RUNTIME_LIBRARY instead — defaulting to MultiThreadedDLL.
# Mixing /MD objects into a static-CRT link fails with LNK2019 on ~15
# __imp_* CRT symbols (see run 29873034156 for release 0.2.1).
#
# Setting the CMP0091-authoritative variable through the -sys crate's
# TRANSCRIBE_CMAKE_ARGS escape hatch forces /MT throughout the C++ tree
# (inherited by the vendored ggml subdirectory). Plain "MultiThreaded"
# (not the $<CONFIG:Debug> generator expression) suffices because the
# -sys build script always configures a Release build.
#
# TODO: drop this if transcribe-cpp-sys learns to derive
# CMAKE_MSVC_RUNTIME_LIBRARY from crt-static in CARGO_CFG_TARGET_FEATURE.
- name: Match the C++ CRT to cargo-dist's +crt-static (Windows)
  if: runner.os == 'Windows'
  shell: bash
  run: echo 'TRANSCRIBE_CMAKE_ARGS=-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded' >> "$GITHUB_ENV"

# Windows: install the Vulkan SDK so the ggml Vulkan backend can build.
# ggml does `find_package(Vulkan COMPONENTS glslc REQUIRED)`, which needs
# the headers, the loader import library (vulkan-1.lib), and the glslc
# shader compiler — all of which only the full LunarG SDK provides on
# Windows. dist's [dist.dependencies] tables have no good Windows
# equivalent for this (chocolatey's vulkan-sdk package is
# community-maintained and lags), so we install a pinned LunarG release
# directly. CMake's FindVulkan locates everything through the VULKAN_SDK
# env var, which must be exported explicitly: the installer only sets a
# machine-level env var, which steps already running in this job never
# see.
#
# The version is pinned (rather than LunarG's "latest" alias) so release
# builds are reproducible and don't break when LunarG ships a new SDK.
# The default install includes everything we need; no optional components
# are requested.
- name: Install the Vulkan SDK (Windows)
  if: runner.os == 'Windows'
  shell: pwsh
  run: |
    $ver = "1.4.350.0"
    $installer = "$env:RUNNER_TEMP\vulkan-sdk.exe"
    curl.exe -sSfL -o $installer "https://sdk.lunarg.com/sdk/download/$ver/windows/vulkansdk-windows-X64-$ver.exe"
    Start-Process -FilePath $installer -ArgumentList "--accept-licenses","--default-answer","--confirm-command","install" -Wait -NoNewWindow
    Add-Content -Path $env:GITHUB_ENV -Value "VULKAN_SDK=C:\VulkanSDK\$ver"
