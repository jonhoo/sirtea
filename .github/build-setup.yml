# Extra steps injected into dist's build-local-artifacts job via the
# `github-build-setup` setting in dist-workspace.toml. The actual logic
# lives in the windows-native-setup composite action so that check.yml's
# Windows job can share it — this file cannot be imported by other
# workflows (it is a dist-specific snippet, not a workflow), but a local
# composite action can be `uses:`d from anywhere. The action self-gates on
# runner.os, so invoking it unconditionally here is a no-op on the Linux
# and macOS builders.
- name: Set up the Windows native build (CRT, Vulkan SDK, link shim)
  uses: ./.github/actions/windows-native-setup
