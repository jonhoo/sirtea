permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
name: check
jobs:
  fmt:
    runs-on: ubuntu-latest
    name: stable / fmt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
        with:
          submodules: true
      - name: Install stable
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # branch=master
        with:
          toolchain: stable
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --check
  clippy:
    runs-on: ubuntu-latest
    name: stable / clippy
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
        with:
          submodules: true
      - name: Install stable
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # branch=master
        with:
          toolchain: stable
          components: clippy
      # The always-on Linux Vulkan backend needs these to build; keep in sync
      # with [dist.dependencies.apt] in dist-workspace.toml.
      - name: Install Vulkan build dependencies
        run: sudo apt-get update && sudo apt-get install -y libvulkan-dev spirv-headers glslc
      - name: cargo clippy
        uses: giraffate/clippy-action@13b9d32482f25d29ead141b79e7e04e7900281e0 # tag=v1.0.1
        with:
          reporter: 'github-pr-check'
          github_token: ${{ secrets.GITHUB_TOKEN }}
  compiles:
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} / stable
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
        with:
          submodules: true
      - name: Install stable
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # branch=master
        with:
          toolchain: stable
      # The always-on Linux Vulkan backend needs these to build; keep in sync
      # with [dist.dependencies.apt] in dist-workspace.toml.
      - name: Install Vulkan build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libvulkan-dev spirv-headers glslc
      # The always-on Windows Vulkan backend likewise needs the LunarG SDK
      # (plus the CRT/link-shim bits releases use); the action self-gates on
      # runner.os and is a no-op on the other matrix legs.
      - name: Set up the Windows native build (CRT, Vulkan SDK, link shim)
        uses: ./.github/actions/windows-native-setup
      - name: cargo check
        run: cargo check --locked --all-features --all-targets
