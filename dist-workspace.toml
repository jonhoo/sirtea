[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
# A GitHub repo to push Homebrew formulas to
tap = "jonhoo/homebrew-tap"
# Publish jobs to run in CI
publish-jobs = ["homebrew"]
# Extra steps for the build jobs (path relative to .github/workflows/; one
# level up so GitHub doesn't parse the step list as a standalone workflow).
# Currently, both Windows-only: force a static MSVC CRT in the transcribe.cpp
# CMake build so it matches dist's +crt-static Rust link, and install the
# LunarG Vulkan SDK (dist's [dist.dependencies] has no Windows table that can
# provide glslc + Vulkan headers + vulkan-1.lib) — see the comments in that
# file.
github-build-setup = "../build-setup.yml"
# TEMPORARY (verification): run the full artifact builds on PRs so the
# Windows Vulkan build can be exercised without tagging a release. Remove
# (and re-run `dist generate`) before merging.
pr-run-mode = "upload"
# Don't inject swatinem/rust-cache into the build jobs (dist does so by
# default whenever pr-run-mode = "upload"): most of the build time here is
# the C++/CMake tree in OUT_DIR plus a fresh Vulkan-shader build, which the
# cargo-centric cache mostly misses, and stale native build dirs are exactly
# the kind of thing we don't want a release-adjacent job resurrecting.
cache-builds = false

# Prebuilt binaries include the Vulkan GPU backend: ggml links it statically
# (unlike the ONNX era's separate libwebgpu_dawn.so, which release installers
# could not ship), so the binaries stay self-contained. Building it needs the
# Vulkan development bits on the CI runner: declared here for the Linux
# builds; installed by ../build-setup.yml for the Windows build.
#
# NOTE: unverified until the first release CI run:
# - whether a Vulkan-enabled binary starts on a machine *without*
#   libvulkan.so.1 installed (ggml is expected to fall back to CPU; if the
#   dynamic loader dependency turns out to be hard, revisit with
#   transcribe-cpp's `dynamic-backends` feature or a CPU-only artifact).
#   On Windows the equivalent dependency is vulkan-1.dll, and there it is
#   *known* to be load-time-hard (the exe links vulkan-1.lib); accepted
#   because GPU drivers install the loader on effectively every desktop and
#   laptop — see the comment in Cargo.toml;
# - the aarch64 build (runs on GitHub's native arm runners, so no
#   cross-compiling of the C++ core is involved — but it has never been
#   exercised).
[dist.dependencies.apt]
cmake = '*'
libvulkan-dev = '*'
spirv-headers = '*'
glslc = '*'

# dist's default Linux build runners are ubuntu-22.04(-arm), but the `glslc`
# package only entered Ubuntu in 23.04, so the apt dependencies above cannot
# be satisfied there. Building on 24.04 instead raises the glibc floor of the
# prebuilt binaries from 2.35 to 2.39 (excluding e.g. Debian bookworm and
# Ubuntu 22.04 hosts) — accepted rather than sideloading glslc from an
# external source into the release path.
[dist.github-custom-runners]
x86_64-unknown-linux-gnu = "ubuntu-24.04"
aarch64-unknown-linux-gnu = "ubuntu-24.04-arm"
